<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Original FeedBlitz Form Preview</title>
    <style>
      body {
        background: #16171d;
        color: #9ca3af;
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 760px;
        margin: 32px auto;
        padding: 0 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <div
        id="F3702_sb_container"
        align="center"
        class="F3702_sb_fbz_page"
        style="padding: 0.5em; clear: both"
      >
        <form
          method="POST"
          name="F3702"
          id="F3702_sb"
          style="display: block; margin: auto; max-width: 600px"
          action="https://app.feedblitz.com/f/f.fbz?Join"
        >
          <div name="F3702__hh">
            <input style="display: block" type="email" name="email_" value="" />
            <input style="display: block" type="email" name="email_address" value="" />
            <input style="display: block" type="email" name="_email" value="" />
            <script>
              var i = 0;
              var x = document.getElementsByName("F3702");
              for (i = 0; i < x.length; i++) {
                x[i].email_.style.display = "none";
                x[i].email_address.style.display = "none";
                x[i]._email.style.display = "none";
                x[i].action = "https://app.feedblitz.com/f/f.fbz?Join";
              }
              var y = document.getElementsByName("F3702__hh");
              for (i = 0; i < y.length; i++) {
                y[i].style.display = "none";
              }
            </script>

            <input type="hidden" name="subcf" value="1" />
            <input type="hidden" name="formid" value="F3702" />
          </div>
          <table
            cellpadding="0"
            cellspacing="0"
            border="0"
            class="F3702_sb_fbz_table"
            style="table-layout: fixed; max-width: 100%; width: 100%"
          >
            <tr>
              <td class="F3702_sb_fbz_form">
                <table
                  border="0"
                  cellpadding="6"
                  cellspacing="0"
                  align="center"
                  width="100%"
                  class="F3702_sb_fbz_table"
                  style="border-radius: 20px"
                >
                  <tr class="F3702_sb_fbz_row">
                    <td class="F3702_sb_fbz_label" style="padding-top: 0.7em; padding: 0"></td>
                    <td style="padding-left: 0.5em; padding-right: 0.5em; width: 100%">
                      <div
                        class="F3702_sb_fbz_text"
                        style="margin-bottom: 0.3em; text-align: center"
                      >
                        Your email address:<b style="color: red" title="Required">*</b>
                      </div>
                      <div
                        class="F3702_sb_fbz_input_container"
                        style="background-image: none; padding-right: 0"
                      >
                        <input
                          class="F3702_sb_fbz_input"
                          type="text"
                          name="email"
                          id="F3702_sb_email"
                          value=""
                          alt="Your email address:"
                          title="Your email address:"
                          placeholder="Your email address:"
                          onclick='clickclear(this, "F3702_sb")'
                          onfocus='clickclear(this, "F3702_sb")'
                          onblur="clickrecall(this)"
                          width="100%"
                          style="width: 100%; padding-right: 0"
                          fbz_val="validateEmail"
                        />
                      </div>
                    </td>
                  </tr>
                  <tr class="F3702_sb_fbz_row">
                    <td class="F3702_sb_fbz_label" style="padding: 0"></td>
                    <td style="padding-left: 0.5em; padding-right: 0.5em; width: 100%">
                      <div
                        class="F3702_sb_fbz_text"
                        style="margin-bottom: 0.3em; text-align: center"
                      >
                        Subscribe to:<b style="color: red" title="Required">*</b>
                      </div>
                      <div class="F3702_sb_fbz_input">
                        <label>
                          <input
                            class="F3702_sb_fbz_input"
                            type="checkbox"
                            name="feedid"
                            id="F3702_sb_feedid"
                            checked
                            style="width: auto"
                            value="501894"
                            alt="Choose the list you want to join"
                            title="Choose the list you want to join"
                          />
                          <span
                            class="F3702_sb_fbz_fieldlabeltext"
                            style="padding-top: 0; padding-bottom: 0"
                          >
                            Chris Skinner's Blog - Daily Updates
                          </span>
                        </label>
                        <br />
                        <label>
                          <input
                            class="F3702_sb_fbz_input"
                            type="checkbox"
                            name="feedid"
                            id="F3702_sb_feedid_1"
                            style="width: auto"
                            value="1122370"
                            alt="Choose the list you want to join"
                            title="Choose the list you want to join"
                          />
                          <span
                            class="F3702_sb_fbz_fieldlabeltext"
                            style="padding-top: 0; padding-bottom: 0"
                          >
                            Chris Skinner's Blog - Weekly Updates
                          </span>
                        </label>
                      </div>
                    </td>
                  </tr>
                  <tr class="F3702_sb_fbz_row">
                    <td class="F3702_sb_fbz_label" style="padding: 0"></td>
                    <td style="padding-left: 0.5em; padding-right: 0.5em; width: 100%">
                      <div
                        class="F3702_sb_fbz_text"
                        style="margin-bottom: 0.3em; text-align: center"
                      >
                        Consent<b style="color: red" title="Required">*</b>
                      </div>
                      <div class="F3702_sb_fbz_input">
                        <label>
                          <input
                            class="F3702_sb_fbz_input"
                            type="checkbox"
                            name="GdprCheck"
                            id="F3702_sb_GdprCheck"
                            style="width: auto"
                            value="accepted"
                            alt="We need your consent to email you about this. You will still need to confirm after you submit the form (a process called dual opt-in)"
                            title="We need your consent to email you about this. You will still need to confirm after you submit the form (a process called dual opt-in)"
                          />
                          <span
                            class="F3702_sb_fbz_fieldlabeltext"
                            style="padding-top: 0; padding-bottom: 0"
                          >
                            Yes, I consent to being emailed
                          </span>
                        </label>
                      </div>
                    </td>
                  </tr>

                  <tr class="F3702_sb_fbz_row_nohover F3702_sb_fbz_smartform">
                    <td class="F3702_sb_fbz_fieldtext" colspan="2">
                      <div style="text-align: center">
                        <input
                          class="F3702_sb_fbz_button"
                          type="button"
                          onclick='try{fbzClearChangedBorders();}catch(e){};req=fbz_v("F3702_sb",F3702_sb_requiredFields);val=fbz_v("F3702_sb",F3702_sb_validateFields,1);if(req && val){smartFormSubmit(this);};'
                          name="fbzsubscribe"
                          id="F3702_sb_subscribe"
                          value="Get Email Updates"
                          alt="click to join"
                          title="click to join"
                          width="100%"
                          style="font-size: 100%; height: inherit; font-family: Tahoma, Geneva, sans-serif; background-color: #8c1c24; color: #ffffff; white-space: normal; width: 100%; margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0"
                        />
                        <img
                          id="F3702_sb_fbz_wait"
                          alt="Please wait..."
                          style="display: none; width: 48px; opacity: 0.5"
                          src="https://assets.feedblitz.com/images/spinner.gif"
                        />
                      </div>
                    </td>
                  </tr>
                  <tr style="display: none">
                    <td colspan="2">
                      <input
                        type="hidden"
                        name="publisherid"
                        id="F3702_sb_publisherid"
                        value="49830596"
                      />
                      <input type="hidden" name="cids" id="F3702_sb_cids" value="1" />
                    </td>
                  </tr>
                  <tr class="F3702_sb_fbz_row_nohover">
                    <td colspan="2" style="padding: 0; border: 0">
                      <div
                        id="F3702_sb_fbz_err"
                        class="F3702_sb_fbz_err"
                        style="position: relative"
                      >
                        Please enter all required fields
                        <img
                          onclick='fbz$("F3702_sb_fbz_err").style.display = "none"'
                          border="0"
                          alt="Click to hide"
                          align="baseline"
                          width="8"
                          height="8"
                          style="float: right; align: baseline; width: 8px; height: 8px; opacity: 0.5; cursor: pointer; position: absolute; top: 4px; right: 4px"
                          src="https://assets.feedblitz.com/images/close.gif"
                        />
                      </div>
                      <div
                        id="F3702_sb_fbz_invalid"
                        class="F3702_sb_fbz_invalid"
                        style="position: relative"
                      >
                        Correct invalid entries
                        <img
                          border="0"
                          alt="Click to hide"
                          align="baseline"
                          width="8"
                          height="8"
                          style="float: right; align: baseline; width: 8px; height: 8px; opacity: 0.5; cursor: pointer; position: absolute; top: 4px; right: 4px"
                          src="https://assets.feedblitz.com/images/close.gif"
                        />
                      </div>
                      <div id="F3702_sb_fbz_status" class="F3702_sb_fbz_err"></div>
                    </td>
                  </tr>
                </table>
                <table
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="100%"
                  class="F3702_sb_fbz_table"
                >
                  <tr>
                    <td
                      class="F3702_sb_fbz_footer"
                      style="border-radius: 0 0 20px 20px; padding: 0.5em"
                    >
                      <a
                        rel="nofollow"
                        class="F3702_sb_fbz_footer"
                        style="padding: 0; background: none; color: red"
                        href="https://www.feedblitz.com/"
                      >
                        Powered by FeedBlitz
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </form>
      </div>

      <script type="text/javascript" src="https://app.feedblitz.com/f/?p13n=501894"></script>

      <script type="text/javascript">
        var F3702_sb_requiredFields = new Array();
        var F3702_sb_validateFields = new Array();
        F3702_sb_requiredFields.push("F3702_sb_email");
        F3702_sb_requiredFields.push("F3702_sb_feedid");
        F3702_sb_requiredFields.push("F3702_sb_GdprCheck");
        F3702_sb_requiredFields.push("F3702_sb_publisherid");
        F3702_sb_requiredFields.push("F3702_sb_cids");
        var F3702_sb_fieldcol = "#000000";
        var fbz_F3702_sb_logged = false;
        function F3702_sb_wait_fn() {
          try {
            if (!fbz_F3702_sb_logged) {
              fbz_SmartForm("F3702_sb", feedblitz_full_form);
              try {
                s("F3702_sb");
              } catch (e) {}
              fbz_FitForm("F3702_sb");
              var F3702_sb_wait_img = fbz_formMetrics(3702, 1);
              fbz$("F3702_sb_wait_img").innerHTML = F3702_sb_wait_img;
              clearInterval(F3702_sb_wait);
              fbz_F3702_sb_logged = true;
            }
          } catch (e) {}
        }
        var F3702_sb_wait = setInterval(F3702_sb_wait_fn, 100);
      </script>
      <div
        id="F3702_sb_wait_img"
        style="width: 0; height: 0; overflow: hidden; line-height: 0; display: inline-block; position: fixed"
      ></div>
    </main>
  </body>
</html>
